<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>DocDrop - Tableau de bord</title>

    <!-- Bootstrap CSS -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" 
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link 
        rel="stylesheet" 
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
  <div class="container">
    <a class="navbar-brand fw-bold" href="#">📄 DocDrop</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbar">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link active" onclick="showSection('upload')">Accueil</a></li>
        <li class="nav-item"><a class="nav-link" onclick="showSection('status')">Statut</a></li>
        <li class="nav-item"><a class="nav-link" onclick="showSection('metadata')">Métadonnées</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- CONTAINER GLOBAL -->
<div class="container py-5">

    <!-- SECTION Upload -->
    <section id="uploadSection">
        <div class="card shadow-lg">
            <div class="card-body">
                <h2 class="mb-4"><i class="bi bi-cloud-upload"></i> Déposer un document</h2>

                <label class="form-label fw-bold">URL du fichier :</label>
                <input type="text" id="fileUrl" class="form-control" placeholder="https://site.com/fichier.pdf">

                <button class="btn btn-primary mt-3" onclick="uploadFromUrl()">
                    <i class="bi bi-upload"></i> Uploader
                </button>

                <div id="uploadMessage" class="mt-3"></div>
            </div>
        </div>
    </section>

    <!-- SECTION Statut -->
    <section id="statusSection" class="d-none">
        <div class="card shadow-lg">
            <div class="card-body">
                <h2 class="mb-4"><i class="bi bi-search"></i> Statut du document</h2>

                <label class="form-label fw-bold">ID du document :</label>
                <input type="text" id="statusId" class="form-control" placeholder="ex: doc_1234">

                <button class="btn btn-secondary mt-3" onclick="checkStatus()">
                    <i class="bi bi-info-circle"></i> Vérifier
                </button>

                <div id="statusMessage" class="mt-3"></div>
            </div>
        </div>
    </section>

    <!-- SECTION Métadonnées -->
    <section id="metadataSection" class="d-none">
        <div class="card shadow-lg">
            <div class="card-body">
                <h2 class="mb-4"><i class="bi bi-file-earmark-text"></i> Métadonnées</h2>

                <label class="form-label fw-bold">ID du document :</label>
                <input type="text" id="metaId" class="form-control" placeholder="ex: doc_1234">

                <button class="btn btn-info mt-3 text-white" onclick="getMetadata()">
                    <i class="bi bi-table"></i> Charger
                </button>

                <div id="metaTable" class="mt-4"></div>
            </div>
        </div>
    </section>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- JS App -->
<script src="script.js"></script>

</body>
</html>
